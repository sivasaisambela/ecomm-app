name: Deploy Azure Function App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: orderprocessor-func
  DOTNET_VERSION: "8.0.x"
  FUNCTIONAPP_PATH: OrderProcessor.Function

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.FUNCTIONAPP_PATH }}/${{ env.FUNCTIONAPP_PATH }}.csproj

      - name: Build
        run: dotnet build ${{ env.FUNCTIONAPP_PATH }}/${{ env.FUNCTIONAPP_PATH }}.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.FUNCTIONAPP_PATH }}/${{ env.FUNCTIONAPP_PATH }}.csproj --configuration Release --output ./publish

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./publish
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
